<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- CSP compatible con entrega mediante meta; frame-ancestors se configura en el servidor. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src 'self';
				script-src 'self' 'unsafe-inline' 'unsafe-eval';
				style-src 'self' 'unsafe-inline';
				img-src 'self' data: https:;
				font-src 'self' data:;
				connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 https://cognito-idp.us-east-2.amazonaws.com https://*.amazonaws.com ws:;
				base-uri 'self';
				form-action 'self';
				worker-src 'self' blob:;
			"
		/>

		<!-- Las cabeceras anti-framing y nosniff pertenecen al servidor/CDN. -->
		<meta name="referrer" content="strict-origin-when-cross-origin" />

		<title>BioRepo - FCB UNMSM</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
